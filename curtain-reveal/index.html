<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curtain Reveal & Counter Timeline</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor-dot"></div>

    <!-- Preloader / Intro Sequence Curtain Layer -->
    <div class="preloader">
      <div class="preloader-images">
        <!-- Fanned Image Stack -->
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&auto=format&fit=crop&q=80"
            alt="img 1"
          />
        </div>
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80"
            alt="img 2"
          />
        </div>
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600&auto=format&fit=crop&q=80"
            alt="img 3"
          />
        </div>
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1487222477894-8943e31ef7b2?w=600&auto=format&fit=crop&q=80"
            alt="img 4"
          />
        </div>
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&auto=format&fit=crop&q=80"
            alt="img 5"
          />
        </div>
        <div class="preloader-image">
          <img
            src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=600&auto=format&fit=crop&q=80"
            alt="img 6"
          />
        </div>
      </div>

      <!-- Intro Text Elements -->
      <div class="preloader-center">
        <div class="preloader-header">
          <h1 class="preloader-title">010101</h1>
        </div>
        <div class="preloader-counter">
          <p class="counter-text">000</p>
        </div>
      </div>
    </div>

    <!-- Global Site Navigation -->
    <nav>
      <a href="#" class="nav-logo">010101</a>
      <div class="nav-links">
        <a href="#" class="nav-link-item">Collections</a>
        <a href="#" class="nav-link-item">Editorial</a>
        <a href="#" class="nav-link-item">Stories</a>
        <a href="#" class="nav-link-item">Studio</a>
        <a href="#" class="nav-link-item">Contact</a>
      </div>
      <button class="hamburger" aria-label="Toggle Menu">
        <span class="line line-1"></span>
        <span class="line line-2"></span>
      </button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu">
      <div class="mobile-menu-background"></div>
      <div class="mobile-menu-content">
        <a href="#">Collections</a>
        <a href="#">Editorial</a>
        <a href="#">Stories</a>
        <a href="#">Studio</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!-- Hero Layer Underneath Preloader Curtain -->
    <section class="hero">
      <div class="hero-header">
        <h1 class="hero-title">010101</h1>
      </div>

      <div class="hero-footer">
        <p class="footer-label">Autumn Edition 2026</p>
        <p class="footer-label">Curated Aesthetics</p>
        <p class="footer-label">All Rights Reserved &copy;</p>
      </div>
    </section>

    <!-- GSAP Engine, Core Custom Ease, & SplitText Premium Configuration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    <script src="../assets/SplitText.min.js"></script>
    <script src="script.js"></script>
    <script>
      const dot = document.querySelector(".cursor-dot");
      const moveX = gsap.quickTo(dot, "x", {
        duration: 0.4,
        ease: "power2.out",
      });
      const moveY = gsap.quickTo(dot, "y", {
        duration: 0.4,
        ease: "power2.out",
      });

      document.addEventListener("mousemove", (e) => {
        moveX(e.clientX);
        moveY(e.clientY);
      });

      document.querySelectorAll("a, button").forEach((el) => {
        el.addEventListener("mouseenter", () =>
          gsap.to(dot, {
            scale: 4,
            duration: 0.25,
            ease: "power2.out",
            overwrite: "auto",
          }),
        );
        el.addEventListener("mouseleave", () =>
          gsap.to(dot, {
            scale: 1,
            duration: 0.25,
            ease: "power2.out",
            overwrite: "auto",
          }),
        );
      });

      const hamburger = document.querySelector(".hamburger");
      const mobileMenu = document.querySelector(".mobile-menu");
      const mobileLinks = document.querySelectorAll(".mobile-menu-content a");
      let isMenuOpen = false;

      gsap.set(mobileLinks, { y: 30, opacity: 0 });

      if (hamburger && mobileMenu) {
        hamburger.addEventListener("click", () => {
          isMenuOpen = !isMenuOpen;
          if (isMenuOpen) {
            hamburger.classList.add("is-open");
            gsap.to(".hamburger .line-1", { y: 6, rotation: 45, duration: 0.3, ease: "power2.inOut" });
            gsap.to(".hamburger .line-2", { y: -6, rotation: -45, duration: 0.3, ease: "power2.inOut" });
            gsap.set(mobileMenu, { display: "block" });
            gsap.to(".mobile-menu-background", {
              clipPath: "circle(150% at 92% 50px)",
              duration: 0.8,
              ease: "power3.inOut"
            });
            gsap.to(mobileLinks, {
              y: 0,
              opacity: 1,
              duration: 0.5,
              stagger: 0.06,
              ease: "power2.out",
              delay: 0.4
            });
          } else {
            hamburger.classList.remove("is-open");
            gsap.to(".hamburger .line-1", { y: 0, rotation: 0, duration: 0.3, ease: "power2.inOut" });
            gsap.to(".hamburger .line-2", { y: 0, rotation: 0, duration: 0.3, ease: "power2.inOut" });
            gsap.to(mobileLinks, { y: 30, opacity: 0, duration: 0.2, ease: "power2.in" });
            gsap.to(".mobile-menu-background", {
              clipPath: "circle(0% at 92% 50px)",
              duration: 0.6,
              ease: "power3.inOut",
              delay: 0.15,
              onComplete: () => gsap.set(mobileMenu, { display: "none" }),
            });
          }
        });
      }
    </script>
  </body>
</html>
