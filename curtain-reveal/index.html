          />

            alt="img 6"
          />

        <div class="preloader-header">
          <h1 class="preloader-title">010101</h1>
        </div>
        <div class="preloader-counter">
          <p class="counter-text">000</p>

      <a href="../" class="nav-logo">
        <img src="https://jeremy0x.vercel.app/logo-icon.svg" alt="Logo" class="nav-logo-icon" />

    <script src="../assets/SplitText.min.js"></script>
