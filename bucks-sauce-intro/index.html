<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bucks Sauce Intro</title>
  <link rel="icon" type="image/x-icon" href="../icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../icon/apple-touch-icon.png" />
  <link rel="manifest" href="../icon/site.webmanifest" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Preloader / Intro Sequence -->
  <div class="preloader">
    <div class="preloader-background"></div>
    
    <!-- Colored circle wipe panels -->
    <div class="preloader-revealer revealer-1"></div>
    <div class="preloader-revealer revealer-2"></div>
    <div class="preloader-revealer revealer-3"></div>
    <div class="preloader-revealer revealer-4"></div>

    <!-- Intro floating food items -->
    <div class="items">
      <div class="item item-1"><img src="assets/chilli.webp" alt="Food 1"></div>
      <div class="item item-2"><img src="assets/cherry.webp" alt="Food 2"></div>
      <div class="item item-3"><img src="assets/onion.webp" alt="Food 3"></div>
      <div class="item item-4"><img src="assets/pineapple.webp" alt="Food 4"></div>
      <div class="item item-5"><img src="assets/garlic.webp" alt="Food 5"></div>
      <div class="item item-6"><img src="assets/habanero.webp" alt="Food 6"></div>
    </div>

    <div class="preloader-logo">
      <img src="../icon/apple-touch-icon.png" alt="Logo">
    </div>
  </div>

  <!-- Main Navigation -->
  <nav>
    <div class="nav-logo">
      <img src="../icon/apple-touch-icon.png" alt="Logo">
    </div>
    <div class="nav-items">
      <a href="#">Shop</a>
      <a href="#">Menu</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <button class="hamburger" aria-label="Toggle Menu">
      <span class="line line-1"></span>
      <span class="line line-2"></span>
    </button>
  </nav>

  <!-- Full-Screen Mobile Menu Overlay -->
  <div class="mobile-menu">
    <div class="mobile-menu-background"></div>
    <div class="mobile-menu-content">
      <div class="mobile-menu-items">
        <a href="#">Shop</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <div class="mobile-menu-footer">
        <p>Fresh ingredients daily.</p>
        <p>Delivered to your doorstep.</p>
      </div>
    </div>
  </div>

  <!-- Hero Section (Reveals underneath) -->
  <section class="hero">
    <div class="hero-header">
      <h1>We Cooking Something...</h1>
    </div>

    <div class="hero-image">
      <div class="hero-image-background"></div>
      <div class="hero-image-bottle-wrapper">
        <img src="assets/bucks-sauce-bottle.avif" alt="Main Product">
      </div>
    </div>

    <div class="hero-footer">
      <p>Fresh ingredients daily.</p>
      <p>Delivered to your doorstep.</p>
    </div>
  </section>

  <!-- GSAP & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="SplitText.min.js"></script> <!-- Premium GreenSock Plugin -->
  <script src="script.js"></script>
</body>
</html>
