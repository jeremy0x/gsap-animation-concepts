<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Card Shuffle Reveal</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Cursor Dot -->
    <div class="cursor-dot"></div>

    <!-- Navigation Bar -->
    <nav class="nav">
      <div class="nav-logo">
        <a href="../" class="nav-brand">
          <img
            src="https://jeremy0x.vercel.app/logo-icon.svg"
            alt="Logo"
            class="nav-icon"
            style="filter: brightness(0)"
          />
          <span>010101</span>
        </a>
      </div>
      <div class="nav-center">
        <a
          href="../circle-wipe-intro/"
          style="color: inherit; text-decoration: none"
          >NEBULA</a
        >
        &middot;
        <a
          href="../curtain-reveal/"
          style="color: inherit; text-decoration: none"
          >ATLAS</a
        >
        &middot;
        <a
          href="../card-shuffle-reveal/"
          style="color: inherit; text-decoration: none"
          >ORBIT</a
        >
      </div>
      <div class="nav-menu">
        <a href="../" style="color: inherit; text-decoration: none">INDEX</a>
      </div>
    </nav>

    <!-- Main Animated Container -->
    <main class="container">
      <!-- Layer 1: Intro Cards (Arranged radially during preloader) -->
      <div class="intro-cards">
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1631341973457-00f1d893616c&w=600&output=webp&q=80"
            alt="Playing Card Deck 1"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1556195332-95503f664ced&w=600&output=webp&q=80"
            alt="Playing Card Deck 2"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1622014402888-e78d0fd790d0&w=600&output=webp&q=80"
            alt="Playing Card Deck 3"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1624543591046-a874d7d2ae30&w=600&output=webp&q=80"
            alt="Playing Card Deck 4"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1632718427831-5cbfeb7b5657&w=600&output=webp&q=80"
            alt="Playing Card Deck 5"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1619869300502-ac8d409e7635&w=600&output=webp&q=80"
            alt="Playing Card Deck 6"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1615229480528-6b8f0f663e33&w=600&output=webp&q=80"
            alt="Playing Card Deck 7"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1529480780361-c8cb81eb5735&w=600&output=webp&q=80"
            alt="Playing Card Deck 8"
          />
        </div>
      </div>

      <!-- Layer 2: Outro Cards (Spread horizontally across hero section) -->
      <div class="outro-cards">
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1631341973457-00f1d893616c&w=600&output=webp&q=80"
            alt="Playing Card 1"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1556195332-95503f664ced&w=600&output=webp&q=80"
            alt="Playing Card 2"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1622014402888-e78d0fd790d0&w=600&output=webp&q=80"
            alt="Playing Card 3"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1624543591046-a874d7d2ae30&w=600&output=webp&q=80"
            alt="Playing Card 4"
          />
        </div>
        <div class="card">
          <img
            src="https://wsrv.nl/?url=images.unsplash.com/photo-1632718427831-5cbfeb7b5657&w=600&output=webp&q=80"
            alt="Playing Card 5"
          />
        </div>
      </div>

      <!-- Hero Footer with Growing Full-Width Typography -->
      <footer class="hero-footer">
        <div class="hero-animation-text">EXPERIMENTAL</div>
      </footer>
    </main>

    <!-- GSAP Engine, CustomEase Plugin & Reusable Cursor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
    <script src="../assets/cursor.js"></script>
    <script src="script.js"></script>
  </body>
</html>
